services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eds_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-eds}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eds} -d ${POSTGRES_DB:-eds}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://eds:eds_local_password@db:5432/eds}
      EDS_ENV: ${EDS_ENV:-local}
      EDS_LOG_LEVEL: ${EDS_LOG_LEVEL:-INFO}
      EDS_SECRET_KEY: ${EDS_SECRET_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    command: >
      sh -c "alembic upgrade head && python -m eds.entrypoints.api"

  web:
    build: ./web
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
      - ./web/tsconfig.json:/app/tsconfig.json

volumes:
  pgdata:
